[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bv-optimizer"
version = "0.1.0"
description = "Bernstein-Vazirani circuit compiler, template-based optimizer and state-vector simulator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["cirq-core>=1.5", "numpy>=1.24", "matplotlib>=3.7"]

[tool.setuptools]
packages = ["bv_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
